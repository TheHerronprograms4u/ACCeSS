<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BU ACCeSS — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./admin.css"/>
</head>
<body class="login-page">

  <!-- Centered Login Card -->
  <div class="login-container">
    <div class="brand-header">
      <div class="brand-logo-wrap">
        <img src="landing-page-imgs/ACCeSS-Logo.png" alt="BU ACCeSS Logo" onerror="this.src='../landing-page-imgs/ACCeSS-Logo.png'"/>
      </div>
      <h1 class="brand-title">BU <em>ACCeSS</em></h1>
      <p class="brand-subtitle">Consortium Admin Portal</p>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Officer Email</label>
      <input class="form-input" type="email" id="email"
             placeholder="officer@buaccess.org"
             autocomplete="email"/>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" type="password" id="password"
             placeholder="••••••••••••"
             autocomplete="current-password"/>
    </div>

    <div class="form-row">
      <button class="link-small" onclick="handleForgotPassword()" type="button">
        Forgot password?
      </button>
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()" type="button">
      <div class="btn-content">
        <div class="spinner"></div>
        <span class="btn-text">Sign In</span>
      </div>
    </button>

    <!-- Error banner -->
    <div class="banner banner-error" id="errorBanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errorMsg">Incorrect email or password.</span>
    </div>

    <!-- Info banner (password reset confirmation) -->
    <div class="banner banner-info" id="infoBanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span id="infoMsg">Password reset email sent. Check your inbox.</span>
    </div>

    <div class="login-divider">or</div>

    <div class="login-back">
      <a href="/index.html">← Back to public site</a>
    </div>
  </div>

  <script type="module">
    import {
      loginWithEmail,
      onAuthChange,
      auth,
    } from "../firebase-config.js";

    import {
      sendPasswordResetEmail,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /* ── Redirect if already signed in ── */
    onAuthChange(user => {
      if (user) window.location.href = '/admin/dashboard.html';
    });

    /* ── Login handler ── */
    async function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const errBanner  = document.getElementById('errorBanner');
      const infoBanner = document.getElementById('infoBanner');

      // Clear banners
      errBanner.classList.remove('show');
      infoBanner.classList.remove('show');

      // Basic validation
      if (!email || !password) {
        document.getElementById('errorMsg').textContent = 'Please enter your email and password.';
        errBanner.classList.add('show');
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.classList.add('loading');
      btn.querySelector('.btn-text').textContent = 'Signing in…';

      const { user, error } = await loginWithEmail(email, password);

      if (user) {
        btn.querySelector('.btn-text').textContent = 'Redirecting…';
        window.location.href = '/admin/dashboard.html';
      } else {
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.querySelector('.btn-text').textContent = 'Sign In';

        const messages = {
          'auth/user-not-found':    'No account found with that email.',
          'auth/wrong-password':    'Incorrect password. Please try again.',
          'auth/invalid-email':     'Please enter a valid email address.',
          'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
          'auth/invalid-credential':'Incorrect email or password.',
          'auth/network-request-failed': 'Network error. Check your connection and try again.',
        };
        document.getElementById('errorMsg').textContent =
          messages[error] || 'Sign in failed. Please try again.';
        errBanner.classList.add('show');
      }
    }

    /* ── Forgot password ── */
    async function handleForgotPassword() {
      const email = document.getElementById('email').value.trim();
      const errBanner  = document.getElementById('errorBanner');
      const infoBanner = document.getElementById('infoBanner');

      errBanner.classList.remove('show');
      infoBanner.classList.remove('show');

      if (!email) {
        document.getElementById('errorMsg').textContent = 'Enter your email above, then click "Forgot password?"';
        errBanner.classList.add('show');
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        document.getElementById('infoMsg').textContent =
          `Password reset email sent to ${email}. Check your inbox.`;
        infoBanner.classList.add('show');
      } catch (err) {
        document.getElementById('errorMsg').textContent =
          'Could not send reset email. Make sure the address is correct.';
        errBanner.classList.add('show');
      }
    }

    /* ── Enter key submits form ── */
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    window.handleLogin          = handleLogin;
    window.handleForgotPassword = handleForgotPassword;
  </script>
</body>
</html>
